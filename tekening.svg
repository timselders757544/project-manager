<text class="vak" x="237" y="1081">1 Trigger</text>
<text class="xs" x="237" y="1103">waardoor</text>
<rect class="cel" x="341" y="1058" width="106" height="58" rx="6"/>
<text class="vak" x="348" y="1081">2 Gelezen</text>
<text class="xs" x="348" y="1103">welke items</text>
<rect class="cel" x="452" y="1058" width="106" height="58" rx="6"/>
