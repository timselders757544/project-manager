<text class="sm" x="474" y="444">post naast de rest:</text>
<text class="sm" x="474" y="465">1. wat verandert?</text>
<text class="sm" x="474" y="486">2. verschil met planning?</text>
<text class="sm" x="474" y="507">3. wat blijft uit?</text>
<text class="sm" x="474" y="528">4. wat maak ik zelf af?</text>
