<text class="lbl" x="706" y="228">Preparations</text>
<text class="sm" x="706" y="252">klaar voor Tim: elk voorstel</text>
<text class="sm" x="706" y="273">één bestand met een status:</text>
<text class="sm" x="706" y="294">mails, stukken, herinnering</text>
