<text class="xs" x="459" y="938">de vier vragen</text>
<rect class="cel" x="563" y="893" width="106" height="58" rx="6"/>
<text class="vak" x="570" y="916">4 Bijgewerkt</text>
<text class="xs" x="570" y="938">welke regel</text>
<rect class="cel" x="674" y="893" width="106" height="58" rx="6"/>
<text class="vak" x="681" y="916">5 Klaargelegd</text>
<text class="xs" x="681" y="938">wat, voor Tim</text>
<rect class="cel" x="785" y="893" width="106" height="58" rx="6"/>
<text class="vak" x="792" y="916">6 Tim deed</text>
<text class="xs" x="792" y="938">sinds de vorige</text>
<text class="sm" x="230" y="975">verwijst naar de lijsten, kopieert niet · de volgende ronde begint bij de laatste regel</text>
<rect class="b arch" x="20" y="1017" width="1240" height="212" rx="8"/>
<text class="lbl" x="34" y="1043">Spelregels</text>
<rect class="cel" x="34" y="1057" width="398" height="76" rx="6"/>
<text class="vak" x="44" y="1081">1 Eén schrijver per bestand</text>
<text class="xs" x="44" y="1103">per bestand staat wie erin schrijft; een controle na elke</text>
<text class="xs" x="44" y="1122">ronde weigert wat de assistent buiten zijn bestanden raakt</text>
<rect class="cel" x="442" y="1057" width="398" height="76" rx="6"/>
<text class="vak" x="452" y="1081">2 Inhoud en machinerie gescheiden</text>
<text class="xs" x="452" y="1103">de project-repo bevat alleen inhoud, geen script; protocol, viewer</text>
<text class="xs" x="452" y="1122">en controles staan één keer apart, elk project noemt zijn versie</text>
<rect class="cel" x="850" y="1057" width="398" height="76" rx="6"/>
<text class="vak" x="860" y="1081">3 Een voorstel is een bestand met een status</text>
<text class="xs" x="860" y="1103">open · ja · pas aan · nee · doorgevoerd; Tims antwoord wordt</text>
<text class="xs" x="860" y="1122">erin geschreven en een nee blijft staan met de reden</text>
<rect class="cel" x="34" y="1141" width="398" height="76" rx="6"/>
<text class="vak" x="44" y="1165">4 Het protocol staat in de repo</text>
<text class="xs" x="44" y="1187">de trigger zegt alleen: volg het protocol; de werkwijze</text>
<text class="xs" x="44" y="1206">veranderen is een bestand veranderen, met geschiedenis</text>
<rect class="cel" x="442" y="1141" width="398" height="76" rx="6"/>
<text class="vak" x="452" y="1165">5 Out there heeft een weekritme</text>
<text class="xs" x="452" y="1187">één keer per week naar buiten kijken, begrensd,</text>
<text class="xs" x="452" y="1206">met hooguit één voorstel</text>
<rect class="cel" x="850" y="1141" width="398" height="76" rx="6"/>
<text class="vak" x="860" y="1165">6 Twee mensen bij de knoppen</text>
<text class="xs" x="860" y="1187">alles hangt nu aan Tim; er is altijd een reserve die erbij kan</text>
<text class="xs" x="860" y="1206">(een afspraak, geen bouwpunt)</text>
