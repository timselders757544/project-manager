<text class="sm" x="949" y="238">krijgt 1× per dag:</text>
<text class="lbl" x="949" y="260">dit ligt klaar</text>
<text class="sm" x="949" y="290">streept en</text>
<text class="sm" x="949" y="311">verstuurt</text>
<path class="arrow" d="M913,256 L933,256"/>
<text class="sm" x="949" y="604">besluit en</text>
<text class="sm" x="949" y="625">corrigeert</text>
