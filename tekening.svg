<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="964" viewBox="0 0 1000 964" role="img" aria-label="Containertekening van de projectassistent">
<style>text{fill:#1f3550;font-family:"Kalam","Comic Sans MS","Chalkboard SE",cursive}
.lbl{font-weight:700;font-size:20px}.sm{font-size:16px}.xs{font-size:14px;fill:#6b7d8f}
.clbl{font-size:15px;font-weight:700;fill:#6b7d8f}
.b{stroke-width:2}
.vast{fill:#e4efe9;stroke:#1d7a5a;stroke-width:3}
.slow{fill:#e3ecf7;stroke:#2c5d9b}
.fast{fill:#fbe9d2;stroke:#b5651d;stroke-width:3}
.flow{fill:#ece4f6;stroke:#6b46a8}
.think{fill:#fbfcfb;stroke:#1f3550;stroke-dasharray:6 4}
.out{fill:#f8f1c9;stroke:#8a7400}
.arch{fill:#eceeef;stroke:#6b7d8f}
.tim{fill:#fbfcfb;stroke:#1f3550;stroke-width:3}
.loop{fill:#eceeef}
.group{fill:none;stroke:#6b7d8f;stroke-width:1}
.container{fill:none;stroke:#6b7d8f;stroke-width:2;stroke-dasharray:8 6}
.arrow{stroke:#1f3550;stroke-width:2;fill:none;marker-end:url(#pijl)}.both{marker-start:url(#pijl)}.tip{fill:#1f3550}</style>
<rect width="1000" height="964" fill="#fbfcfb"/>
<defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tip"/></marker></defs>
<rect class="b vast" x="200" y="16" width="600" height="72" rx="0"/>
<text class="lbl" x="214" y="42">Goal</text>
<text class="sm" x="214" y="66">waar het project naartoe moet · van Tim</text>
<text class="xs" text-anchor="end" x="788" y="41">altijd</text>
<path class="arrow" d="M500,88 L500,102"/>
<rect class="b tim" x="815" y="16" width="165" height="678" rx="8"/>
<text class="lbl" x="829" y="42">Tim</text>
<text class="sm" x="829" y="66">geeft het doel</text>
<path class="arrow" d="M815,52 L802,52"/>
<text class="sm" x="829" y="240">besluit en</text>
<text class="sm" x="829" y="261">corrigeert</text>
<path class="arrow" d="M815,250 L802,250"/>
<text class="sm" x="829" y="392">krijgt 1× per dag:</text>
<text class="lbl" x="829" y="414">dit ligt klaar</text>
<text class="sm" x="829" y="444">streept en</text>
<text class="sm" x="829" y="465">verstuurt</text>
<path class="arrow" d="M792,409 L813,409"/>
<rect class="b flow" x="20" y="104" width="155" height="90" rx="24"/>
<text class="lbl" x="34" y="130">Wekker</text>
<text class="sm" x="34" y="154">nieuw data-item</text>
<text class="sm" x="34" y="175">dagelijkse ronde</text>
<path class="arrow" d="M177,149 L214,149"/>
<rect class="b flow" x="20" y="206" width="155" height="110" rx="24"/>
<text class="lbl" x="34" y="232">Postbus</text>
<text class="sm" x="34" y="256">data-items met</text>
<text class="sm" x="34" y="277">projectlabel;</text>
<text class="sm" x="34" y="298">hij haalt ze op</text>
<path class="arrow" d="M177,240 L214,240"/>
<rect class="b flow" x="20" y="340" width="155" height="72" rx="24"/>
<text class="lbl" x="34" y="366">Out there</text>
<text class="sm" x="34" y="390">wat buiten speelt</text>
<path class="arrow" d="M177,376 L198,376"/>
<rect class="container" x="200" y="104" width="600" height="590" rx="12"/>
<text class="clbl" x="216" y="124">Projectassistent, elke ronde:</text>
<rect class="loop" x="216" y="134" width="568" height="30" rx="15"/>
<text class="sm" x="232" y="155">wakker → lezen → analyseren → bijwerken → acties → rapporteren</text>
<rect class="group" x="209" y="173" width="288" height="454" rx="10"/>
<rect class="b flow" x="216" y="180" width="274" height="80" rx="24"/>
<text class="lbl" x="230" y="206">Nieuwe post</text>
<text class="sm" x="230" y="230">data-items uit de postbus</text>
<text class="xs" text-anchor="end" x="478" y="205">altijd</text>
<rect class="b slow" x="216" y="270" width="274" height="80" rx="8"/>
<text class="lbl" x="230" y="296">Plan</text>
<text class="sm" x="230" y="320">mijlpalen: 4 okt. · 12 dec</text>
<text class="xs" text-anchor="end" x="478" y="295">altijd</text>
<rect class="b fast" x="216" y="360" width="274" height="80" rx="8"/>
<text class="lbl" x="230" y="386">Stand</text>
<text class="sm" x="230" y="410">beloftes · besluiten</text>
<text class="xs" text-anchor="end" x="478" y="385">altijd</text>
<rect class="b slow" x="216" y="450" width="274" height="80" rx="8"/>
<text class="lbl" x="230" y="476">Programmavoorstel</text>
<text class="sm" x="230" y="500">V1 → V2 → V3</text>
<text class="xs" text-anchor="end" x="478" y="500">als nodig</text>
<rect class="b slow" x="216" y="540" width="274" height="80" rx="8"/>
<text class="lbl" x="230" y="566">Mensen en partijen</text>
<text class="sm" x="230" y="590">wie, en wat ze willen</text>
<text class="xs" text-anchor="end" x="478" y="590">als nodig</text>
<rect class="b think" x="540" y="180" width="244" height="136" rx="8"/>
<text class="lbl" x="554" y="206">Analyse</text>
<text class="sm" x="554" y="230">legt de post naast de rest:</text>
<text class="sm" x="554" y="251">1. wat verandert hierdoor?</text>
<text class="sm" x="554" y="272">2. verschil met het plan?</text>
<text class="sm" x="554" y="293">3. wat blijft uit?</text>
<path class="arrow both" d="M499,248 L538,248"/>
<rect class="group" x="533" y="334" width="259" height="294" rx="10"/>
<path class="arrow" d="M662,316 L662,332"/>
<rect class="b out" x="540" y="341" width="244" height="64" rx="8"/>
<text class="lbl" x="554" y="367">Klaar voor Tim</text>
<text class="sm" x="554" y="391">concepten · herinneringen</text>
<rect class="b out" x="540" y="413" width="244" height="64" rx="8"/>
<text class="lbl" x="554" y="439">To-do voor Tim</text>
<text class="sm" x="554" y="463">alleen wat alleen Tim kan</text>
<rect class="b out" x="540" y="485" width="244" height="64" rx="8"/>
<text class="lbl" x="554" y="511">Redactie</text>
<text class="sm" x="554" y="535">nieuwe versie van het voorstel</text>
<rect class="b out" x="540" y="557" width="244" height="64" rx="8"/>
<text class="lbl" x="554" y="583">Dossier bijgewerkt</text>
<text class="sm" x="554" y="607">stukken en notities erbij</text>
<rect class="b fast" x="216" y="638" width="568" height="44" rx="8"/>
<text class="lbl" x="230" y="664">Logboek</text>
<text class="sm" x="312" y="664">elke ronde: wat hij las, zag, bijwerkte en deed, met de bron</text>
<rect class="b arch" x="20" y="716" width="460" height="72" rx="8"/>
<text class="lbl" x="34" y="742">Dossiers</text>
<text class="sm" x="34" y="766">wat het project bewaart</text>
<text class="xs" text-anchor="end" x="468" y="741">als nodig</text>
<rect class="b vast" x="520" y="716" width="460" height="72" rx="0"/>
<text class="lbl" x="534" y="742">Foundation</text>
<text class="sm" x="534" y="766">procesplan · projectbeschrijving</text>
<path class="arrow both" d="M250,714 L250,696"/>
<text class="xs" x="262" y="710">leest en werkt bij</text>
<rect class="b out" x="20" y="808" width="960" height="72" rx="8"/>
<text class="lbl" x="34" y="834">Dashboard</text>
<text class="sm" x="34" y="858">Tims venster op de stand</text>
<path class="arrow" d="M500,694 L500,806"/>
<rect class="b vast" x="20" y="904" width="26" height="18" rx="0"/>
<text class="sm" x="54" y="919">Vast</text>
<rect class="b slow" x="158" y="904" width="26" height="18" rx="4"/>
<text class="sm" x="192" y="919">Langzaam</text>
<rect class="b fast" x="296" y="904" width="26" height="18" rx="4"/>
<text class="sm" x="330" y="919">Snel</text>
<rect class="b flow" x="434" y="904" width="26" height="18" rx="9"/>
<text class="sm" x="468" y="919">Stroom</text>
<rect class="b think" x="572" y="904" width="26" height="18" rx="4"/>
<text class="sm" x="606" y="919">Denkwerk</text>
<rect class="b out" x="710" y="904" width="26" height="18" rx="4"/>
<text class="sm" x="744" y="919">Uitkomst</text>
<rect class="b arch" x="848" y="904" width="26" height="18" rx="4"/>
<text class="sm" x="882" y="919">Archief</text>
<text class="xs" x="20" y="950">Kleur: hoe snel het verandert. Rechtsboven in een vak: wanneer hij het leest (altijd of als nodig).</text>
</svg>
