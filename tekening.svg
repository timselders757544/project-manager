<text class="sm" x="482" y="475">1. wat verandert?</text>
<text class="sm" x="482" y="496">2. verschil met plan?</text>
<text class="sm" x="482" y="517">3. wat blijft uit?</text>
<path class="arrow" d="M437,472 L466,472"/>
<path class="arrow" d="M654,472 L683,472"/>
<rect class="b fast" x="216" y="762" width="688" height="44" rx="8"/>
