<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-label="Containertekening van de projectassistent">
<style>text{fill:#1f3550;font-family:"Kalam","Comic Sans MS","Chalkboard SE",cursive}
.lbl{font-weight:700;font-size:20px}.sm{font-size:16px}.xs{font-size:14px;fill:#6b7d8f}
.clbl{font-size:15px;font-weight:700;fill:#6b7d8f}
.box,.stand,.analyse,.top,.base,.dash{fill:#fbfcfb;stroke:#1f3550;stroke-width:2}
.stand{stroke-width:3}.analyse{fill:#e4efe9;stroke:#1d7a5a}
.top{stroke:#1d7a5a;stroke-width:3}.base{fill:#e4efe9;stroke:#1d7a5a}
.dash{stroke:#1d7a5a;stroke-width:3}
.container{fill:none;stroke:#6b7d8f;stroke-width:2;stroke-dasharray:8 6}
.arrow{stroke:#1f3550;stroke-width:2;fill:none;marker-end:url(#pijl)}.tip{fill:#1f3550}</style>
<rect width="1000" height="760" fill="#fbfcfb"/>
<defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tip"/></marker></defs>
<rect class="top" x="250" y="16" width="350" height="96" rx="8"/>
<text class="lbl" x="264" y="42">Goal</text>
<text class="sm" x="264" y="66">waar het project naartoe moet</text>
<rect class="top" x="620" y="16" width="360" height="96" rx="8"/>
<text class="lbl" x="634" y="42">Plan</text>
<text class="sm" x="634" y="66">mijlpalen: 4 okt. · 12 dec bijeenkomst</text>
<rect class="box" x="20" y="180" width="200" height="110" rx="8"/>
<text class="lbl" x="34" y="206">Postbus</text>
<text class="sm" x="34" y="230">data-items met</text>
<text class="sm" x="34" y="251">projectlabel</text>
<rect class="box" x="20" y="310" width="200" height="90" rx="8"/>
<text class="lbl" x="34" y="336">Out there</text>
<text class="sm" x="34" y="360">wat buiten speelt</text>
<rect class="container" x="240" y="140" width="740" height="420" rx="12"/>
<text class="clbl" x="256" y="162">Projectmanager</text>
<rect class="stand" x="256" y="176" width="300" height="170" rx="8"/>
<text class="lbl" x="270" y="202">De stand</text>
<text class="sm" x="270" y="226">• doel en plan</text>
<text class="sm" x="270" y="247">• beloftes</text>
<text class="sm" x="270" y="268">• besluiten</text>
<text class="sm" x="270" y="289">• programmavoorstel</text>
<text class="sm" x="270" y="310">• mensen en partijen</text>
<rect class="analyse" x="600" y="176" width="364" height="170" rx="8"/>
<text class="lbl" x="614" y="202">Analyse</text>
<text class="sm" x="614" y="226">houdt de stand tegen het licht:</text>
<text class="sm" x="614" y="247">1. wat verandert hierdoor?</text>
<text class="sm" x="614" y="268">2. verschil met goal en plan</text>
<text class="sm" x="614" y="289">3. wat blijft uit?</text>
<path class="arrow" d="M600,240 L560,240"/>
<path class="arrow" d="M560,290 L600,290"/>
<path class="arrow" d="M425,114 L425,174"/>
<path class="arrow" d="M800,114 L800,174"/>
<path class="arrow" d="M222,235 L254,235"/>
<text class="xs" x="176" y="174">haalt op</text>
<path class="arrow" d="M222,362 L620,362 L640,350"/>
<text class="clbl" x="256" y="392">Uitkomsten: hij maakt ze zelf af, Tim streept</text>
<rect class="box" x="256" y="404" width="230" height="140" rx="8"/>
<text class="lbl" x="270" y="430">To-do</text>
<text class="sm" x="270" y="454">→ Tim</text>
<text class="sm" x="270" y="475">→ anderen</text>
<text class="sm" x="270" y="496">+ reminder?</text>
<rect class="box" x="500" y="404" width="230" height="140" rx="8"/>
<text class="lbl" x="514" y="430">Vergelijking</text>
<text class="sm" x="514" y="454">Tims to-do's naast</text>
<text class="sm" x="514" y="475">privé en andere</text>
<text class="sm" x="514" y="496">projecten</text>
<rect class="box" x="744" y="404" width="220" height="140" rx="8"/>
<text class="lbl" x="758" y="430">Redactie</text>
<text class="sm" x="758" y="454">programmavoorstel</text>
<text class="sm" x="758" y="475">V1 → V2 → V3</text>
<path class="arrow" d="M782,346 L782,402"/>
<path class="arrow" d="M615,346 L615,402"/>
<path class="arrow" d="M440,346 L371,402"/>
<rect class="base" x="20" y="580" width="460" height="72" rx="8"/>
<text class="lbl" x="34" y="606">Dossiers</text>
<text class="sm" x="34" y="630">wat het project bewaart</text>
<rect class="base" x="520" y="580" width="460" height="72" rx="8"/>
<text class="lbl" x="534" y="606">Foundation</text>
<text class="sm" x="534" y="630">procesplan · projectbeschrijving</text>
<path class="arrow" d="M230,578 L230,330 L254,330"/>
<rect class="dash" x="20" y="672" width="960" height="72" rx="8"/>
<text class="lbl" x="34" y="698">Dashboard</text>
<text class="sm" x="34" y="722">het resultaat van al deze zaken in één blik</text>
<path class="arrow" d="M500,562 L500,670"/>
</svg>
