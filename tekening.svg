<text class="sm" x="312" y="953">één regel per ronde · er komt alleen bij · niets gevonden is ook een regel</text>
<rect class="cel" x="230" y="965" width="106" height="58" rx="6"/>
<text class="vak" x="237" y="988">1 Trigger</text>
<text class="xs" x="237" y="1010">waardoor</text>
<rect class="cel" x="341" y="965" width="106" height="58" rx="6"/>
<text class="vak" x="348" y="988">2 Gelezen</text>
<text class="xs" x="348" y="1010">welke items</text>
<rect class="cel" x="452" y="965" width="106" height="58" rx="6"/>
<text class="vak" x="459" y="988">3 Gezien</text>
<text class="xs" x="459" y="1010">de vier vragen</text>
<rect class="cel" x="563" y="965" width="106" height="58" rx="6"/>
<text class="vak" x="570" y="988">4 Bijgewerkt</text>
<text class="xs" x="570" y="1010">welke regel</text>
<rect class="cel" x="674" y="965" width="106" height="58" rx="6"/>
<text class="vak" x="681" y="988">5 Klaargelegd</text>
<text class="xs" x="681" y="1010">wat, voor Tim</text>
<rect class="cel" x="785" y="965" width="106" height="58" rx="6"/>
<text class="vak" x="792" y="988">6 Tim deed</text>
<text class="xs" x="792" y="1010">sinds de vorige</text>
<text class="sm" x="230" y="1047">verwijst naar de lijsten, kopieert niet · de volgende ronde begint bij de laatste regel</text>
<rect class="b arch" x="20" y="1089" width="1240" height="212" rx="8"/>
<text class="lbl" x="34" y="1115">Spelregels</text>
<rect class="cel" x="34" y="1129" width="398" height="76" rx="6"/>
<text class="vak" x="44" y="1153">1 Eén schrijver per bestand</text>
<text class="xs" x="44" y="1175">per bestand staat wie erin schrijft; een controle na elke</text>
<text class="xs" x="44" y="1194">ronde weigert wat de assistent buiten zijn bestanden raakt</text>
<rect class="cel" x="442" y="1129" width="398" height="76" rx="6"/>
<text class="vak" x="452" y="1153">2 Inhoud en machinerie gescheiden</text>
<text class="xs" x="452" y="1175">de project-repo bevat alleen inhoud, geen script; protocol, viewer</text>
<text class="xs" x="452" y="1194">en controles staan één keer in Superpak, voor elk project gelijk</text>
<rect class="cel" x="850" y="1129" width="398" height="76" rx="6"/>
<text class="vak" x="860" y="1153">3 Een voorstel is een bestand met een status</text>
<text class="xs" x="860" y="1175">open · ja · pas aan · nee · doorgevoerd; Tims antwoord wordt</text>
<text class="xs" x="860" y="1194">erin geschreven en een nee blijft staan met de reden</text>
<rect class="cel" x="34" y="1213" width="398" height="76" rx="6"/>
<text class="vak" x="44" y="1237">4 Het protocol staat in de repo</text>
<text class="xs" x="44" y="1259">de trigger zegt alleen: volg het protocol; de werkwijze</text>
<text class="xs" x="44" y="1278">veranderen is een bestand veranderen, met geschiedenis</text>
<rect class="cel" x="442" y="1213" width="398" height="76" rx="6"/>
<text class="vak" x="452" y="1237">5 Out there heeft een weekritme</text>
<text class="xs" x="452" y="1259">één keer per week naar buiten kijken, begrensd,</text>
<text class="xs" x="452" y="1278">met hooguit één voorstel</text>
<rect class="cel" x="850" y="1213" width="398" height="76" rx="6"/>
<text class="vak" x="860" y="1237">6 Twee mensen bij de knoppen</text>
<text class="xs" x="860" y="1259">alles hangt nu aan Tim; er is altijd een reserve die erbij kan</text>
<text class="xs" x="860" y="1278">(een afspraak, geen bouwpunt)</text>
