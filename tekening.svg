<text class="sm" x="706" y="512">nieuwe versie (redactie)</text>
<rect class="b slow" x="216" y="534" width="212" height="64" rx="8"/>
<text class="lbl" x="230" y="560">Mensen en partijen</text>
<text class="sm" x="230" y="584">wie wil wat</text>
<text class="xs" text-anchor="end" x="416" y="584">als nodig</text>
