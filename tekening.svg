<text class="sm" x="706" y="728">bijgewerkt</text>
<rect class="b flow" x="216" y="202" width="212" height="108" rx="24"/>
<text class="lbl" x="230" y="228">Nieuwe post</text>
<text class="sm" x="230" y="252">data-items</text>
<text class="sm" x="230" y="273">uit de postbus</text>
<text class="xs" text-anchor="end" x="416" y="252">altijd</text>
<rect class="b out" x="692" y="202" width="212" height="108" rx="8"/>
<text class="lbl" x="706" y="228">Klaar voor Tim</text>
<text class="sm" x="706" y="252">concept-mails</text>
<text class="sm" x="706" y="273">documenten · rapporten</text>
<text class="sm" x="706" y="294">herinneringen</text>
<rect class="b think" x="468" y="404" width="184" height="136" rx="8"/>
