<text class="xs" x="459" y="1103">de vier vragen</text>
<rect class="cel" x="563" y="1058" width="106" height="58" rx="6"/>
<text class="vak" x="570" y="1081">4 Bijgewerkt</text>
<text class="xs" x="570" y="1103">welke regel</text>
<rect class="cel" x="674" y="1058" width="106" height="58" rx="6"/>
<text class="vak" x="681" y="1081">5 Klaargelegd</text>
<text class="xs" x="681" y="1103">wat, voor Tim</text>
<rect class="cel" x="785" y="1058" width="106" height="58" rx="6"/>
<text class="vak" x="792" y="1081">6 Tim deed</text>
<text class="xs" x="792" y="1103">sinds de vorige</text>
<text class="sm" x="230" y="1140">verwijst naar de lijsten, kopieert niet · de volgende ronde begint bij de laatste regel</text>
<rect class="b arch" x="20" y="1182" width="1240" height="212" rx="8"/>
<text class="lbl" x="34" y="1208">Spelregels</text>
<rect class="cel" x="34" y="1222" width="398" height="76" rx="6"/>
<text class="vak" x="44" y="1246">1 Eén schrijver per bestand</text>
<text class="xs" x="44" y="1268">per bestand staat wie erin schrijft; een controle na elke</text>
<text class="xs" x="44" y="1287">ronde weigert wat de assistent buiten zijn bestanden raakt</text>
<rect class="cel" x="442" y="1222" width="398" height="76" rx="6"/>
<text class="vak" x="452" y="1246">2 Inhoud en machinerie gescheiden</text>
<text class="xs" x="452" y="1268">de project-repo bevat alleen inhoud, geen script; protocol, viewer</text>
<text class="xs" x="452" y="1287">en controles staan één keer in Superpak, voor elk project gelijk</text>
<rect class="cel" x="850" y="1222" width="398" height="76" rx="6"/>
<text class="vak" x="860" y="1246">3 Een voorstel is een bestand met een status</text>
<text class="xs" x="860" y="1268">open · ja · pas aan · nee · doorgevoerd · vervallen; Tims</text>
<text class="xs" x="860" y="1287">antwoord wordt erin geschreven, een nee met de reden</text>
<rect class="cel" x="34" y="1306" width="398" height="76" rx="6"/>
<text class="vak" x="44" y="1330">4 Het protocol staat in de repo</text>
<text class="xs" x="44" y="1352">de trigger zegt alleen: volg het protocol; de werkwijze</text>
<text class="xs" x="44" y="1371">veranderen is een bestand veranderen, met geschiedenis</text>
<rect class="cel" x="442" y="1306" width="398" height="76" rx="6"/>
<text class="vak" x="452" y="1330">5 Out there heeft een weekritme</text>
<text class="xs" x="452" y="1352">één keer per week naar buiten kijken, begrensd,</text>
<text class="xs" x="452" y="1371">met hooguit één voorstel</text>
<rect class="cel" x="850" y="1306" width="398" height="76" rx="6"/>
<text class="vak" x="860" y="1330">6 Twee mensen bij de knoppen</text>
<text class="xs" x="860" y="1352">alles hangt nu aan Tim; later een reserve die erbij kan</text>
<text class="xs" x="860" y="1371">(afspraak voor later, nu nog niet: B42)</text>
